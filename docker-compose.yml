services:
  php:
    build: ./docker/php
    volumes:
      - .:/app
    depends_on:
      - selenium
    networks:
      - selenium
    command: tail -f /dev/null

  selenium:
    image: seleniarm/standalone-chromium:latest
    ports:
      - "4444:4444"
    networks:
      - selenium

networks:
  selenium:
    driver: bridge